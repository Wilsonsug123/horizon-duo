name: Build iOS

on:
  workflow_dispatch:

env:
  ASSETS_REPO: horizon-assets

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Tools (Mac)
        run: |
          brew install ldid
          
      - name: Download Assets
        env:
          GITHUB_TOKEN: ${{ secrets.ASSETS_TOKEN }}
        run: |
          gh release download assets --repo ${{ github.repository_owner }}/${{ env.ASSETS_REPO }} --pattern "26.3.zip" --dir ~/
          cd ~/
          unzip 26.3.zip
          mv 26.3 horizon-resources

      - name: Package IPA
        run: |
          chmod +x ./packaging/ios/package.sh
          ./packaging/ios/package.sh device

      - name: Upload IPA to Private Repo
        env:
          GITHUB_TOKEN: ${{ secrets.ASSETS_TOKEN }}
        run: |
          gh release upload assets ~/Horizon.ipa --repo ${{ github.repository_owner }}/${{ env.ASSETS_REPO }} --clobber
